<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <title>أقرب · Closer</title>
    <meta name="robots" content="noindex" />
    <style>
      html {
        background: #f7f6fd;
      }
      @media (prefers-color-scheme: dark) {
        html {
          background: #0e0d24;
        }
      }
    </style>
    <script>
      // GitHub Pages SPA fallback: remember the deep link, then load the app.
      try {
        sessionStorage.setItem(
          'closer:redirect',
          location.pathname + location.search + location.hash,
        )
      } catch (e) {}
      location.replace('/closer/')
    </script>
  </head>
  <body></body>
</html>
